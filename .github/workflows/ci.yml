name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --release --no-fail-fast

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-wasm-

      - name: Build WASM (default features)
        run: cargo build --release --target wasm32-unknown-unknown
        # The `multicore` feature is intentionally NOT built here: it requires
        # a nightly toolchain with `-Z build-std` and the `atomics` / `bulk-memory`
        # WASM target features. Consumers who need threaded WASM set this up
        # in their own build environment.

      # Regression gate for the 0.2.3 hang: rayon reaching the default wasm
      # artifact means every shield proof spins at 100% CPU forever, because
      # there are no worker threads for it to wait on. A `cargo build` alone
      # does NOT catch this — the broken artifact compiles perfectly and only
      # hangs at runtime, which is how 0.2.3 shipped to npm.
      #
      # Checking the built binary rather than `cargo tree` is deliberate:
      # zcash_client_backend has a hard (non-optional) rayon dependency, so
      # rayon is always in the dependency graph. It stays out of the artifact
      # only because its sole caller there (`scan.rs`) is unreachable from
      # this crate and LTO drops it. The artifact is the thing that ships,
      # so the artifact is the thing to assert on.
      - name: Assert wasm artifact is rayon-free
        run: |
          WASM=target/wasm32-unknown-unknown/release/pivx_wallet_kit.wasm
          test -f "$WASM" || { echo "::error::$WASM not found"; exit 1; }

          # Prove `strings` is actually reading symbol data before trusting a
          # zero rayon count. `wasm-opt` already strips the name section, and a
          # future build tightening that further would leave `grep -c rayon`
          # returning 0 because there is nothing to search — the gate would keep
          # passing while checking nothing. Known proving symbols must be
          # present for the absence of rayon to mean anything.
          SENTINEL=$(strings -a "$WASM" | grep -c -e groth16 -e bellman -e sapling || true)
          if [ "$SENTINEL" -eq 0 ]; then
            echo "::error::No known proving symbols found in $WASM."
            echo "Either this is not a real proving build, or the binary no longer"
            echo "carries readable symbols — in which case the rayon check below"
            echo "would pass vacuously and must not be trusted."
            exit 1
          fi
          echo "Sentinel: $SENTINEL proving symbol reference(s) — strings is reading real data."

          COUNT=$(strings -a "$WASM" | grep -c rayon || true)
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Found $COUNT rayon references in the default wasm artifact."
            echo "Rayon in a threadless wasm build hangs forever during Groth16 proving."
            echo "Check that no dependency re-enabled bellman's or sapling's"
            echo "'multicore' default feature (see the note in Cargo.toml)."
            strings -a "$WASM" | grep rayon | sort -u | head -20
            exit 1
          fi
          echo "OK: no rayon references in the default wasm artifact."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-clippy-
      - run: cargo clippy --release --no-deps -- -D warnings
